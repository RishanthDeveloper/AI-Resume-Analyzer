server.port=8000

# Fallback key for server-side use only. The frontend normally supplies its
# own key per-request via the apiKey form field / X-Gemini-Api-Key header.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
