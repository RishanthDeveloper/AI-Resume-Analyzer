services:
  - type: web
    name: resume-analyzer-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    context: ./backend
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8000
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
