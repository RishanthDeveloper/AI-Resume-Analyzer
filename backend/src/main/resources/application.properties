# Port configuration — respects PORT env var for Render deployment, defaults to 8000
server.port=${PORT:8000}

# Gemini API configuration
# Fallback key for server-side use only. The frontend normally supplies its
# own key per-request via the apiKey parameter.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# Supabase configuration for backend server-side history persistence
supabase.url=${SUPABASE_URL:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}

# CORS Allowed Origins (comma-separated, e.g. http://localhost:5500,https://my-app.vercel.app)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000}

# File Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
